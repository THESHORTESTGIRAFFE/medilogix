{% extends "base.html" %}

{% block title %}{{ form_action }} Supplier - MediLogix{% endblock %}

{% block content %}
<h2>{{ form_action }} Supplier</h2>
<div class="card shadow-sm mt-3">
    <div class="card-body">
        <form method="POST" action="">
            <div class="mb-3">
                <label for="name" class="form-label">Supplier Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="name" name="name" value="{{ supplier.name if supplier else '' }}" required>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="contact_person" class="form-label">Contact Person</label>
                    <input type="text" class="form-control" id="contact_person" name="contact_person" value="{{ supplier.contact_person if supplier else '' }}">
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ supplier.email if supplier else '' }}">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="tel" class="form-control" id="phone" name="phone" value="{{ supplier.phone if supplier else '' }}">
                </div>
                <div class="col-md-6">
                    <label for="payment_terms" class="form-label">Payment Terms</label>
                    <input type="text" class="form-control" id="payment_terms" name="payment_terms" value="{{ supplier.payment_terms if supplier else '' }}" placeholder="e.g., Net 30, COD">
                </div>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea class="form-control" id="address" name="address" rows="3">{{ supplier.address if supplier else '' }}</textarea>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="rating" class="form-label">Rating (0.00 - 5.00)</label>
                    <input type="number" step="0.01" min="0" max="5" class="form-control" id="rating" name="rating" value="{{ "%.2f"|format(supplier.rating) if supplier else '0.00' }}">
                </div>
                <div class="col-md-6 d-flex align-items-center">
                    <div class="form-check form-switch mt-4">
                        <input class="form-check-input" type="checkbox" id="is_blacklisted" name="is_blacklisted" {% if supplier and supplier.is_blacklisted %}checked{% endif %}>
                        <label class="form-check-label" for="is_blacklisted">Blacklisted</label>
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <label for="notes" class="form-label">Notes</label>
                <textarea class="form-control" id="notes" name="notes" rows="3">{{ supplier.notes if supplier else '' }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary">Save Supplier</button>
            <a href="{{ url_for('suppliers.list_suppliers') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
