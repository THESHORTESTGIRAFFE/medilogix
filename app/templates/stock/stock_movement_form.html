{% extends "base.html" %}

{% block title %}{{ form_action }} Stock Movement - MediLogix PMD{% endblock %}

{% block content %}
<h2>{{ form_action }} Stock Movement</h2>
<div class="card shadow-sm mt-3">
    <div class="card-body">
        <form method="POST" action="{{ url_for('stock.add_stock_movement') }}">
            {# CSRF token if using Flask-WTF #}

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="item_id" class="form-label">Item <span class="text-danger">*</span></label>
                    <select class="form-select" id="item_id" name="item_id" required>
                        <option value="" disabled {% if not form_data or not form_data.item_id %}selected{% endif %}>Select Item</option>
                        {% for item in items %}
                        <option value="{{ item.id }}" {% if form_data and form_data.item_id == item.id|string %}selected{% endif %}>{{ item.name }} ({{ item.sku if item.sku else 'No SKU' }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="location_id" class="form-label">Location <span class="text-danger">*</span></label>
                    <select class="form-select" id="location_id" name="location_id" required>
                        <option value="" disabled {% if not form_data or not form_data.location_id %}selected{% endif %}>Select Location</option>
                        {% for location in locations %}
                        <option value="{{ location.id }}" {% if form_data and form_data.location_id == location.id|string %}selected{% endif %}>{{ location.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="movement_type" class="form-label">Movement Type <span class="text-danger">*</span></label>
                    <select class="form-select" id="movement_type" name="movement_type" required>
                        <option value="" disabled {% if not form_data or not form_data.movement_type %}selected{% endif %}>Select Type</option>
                        {% for type in movement_types %}
                        <option value="{{ type }}" {% if form_data and form_data.movement_type == type %}selected{% endif %}>{{ type.replace('_', ' ')|title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="movement_date" class="form-label">Movement Date & Time <span class="text-danger">*</span></label>
                    <input type="datetime-local" class="form-control" id="movement_date" name="movement_date" value="{{ form_data.movement_date if form_data else current_datetime }}" required>
                </div>
            </div>

            <hr>
            <div id="issuance-options" style="display: none;">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="batch-selection" class="form-label">Select Batch (Oldest First)</label>
                        <select id="batch-selection" class="form-select">
                            <option value="">Select a batch to issue</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <h5>Batches</h5>

            <div id="batches-container">
                <!-- Batch 0 -->
                <div class="batch-form" data-batch-index="0">
                    <div class="row mb-3 align-items-end">
                        <div class="col-md-3">
                            <label for="batches[0][quantity]" class="form-label">Quantity <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" class="form-control" id="batches[0][quantity]" name="batches[0][quantity]" required>
                        </div>
                        <div class="col-md-3">
                            <label for="batches[0][batch_number]" class="form-label">Batch Number</label>
                            <input type="text" class="form-control" id="batches[0][batch_number]" name="batches[0][batch_number]">
                        </div>
                        <div class="col-md-3">
                            <label for="batches[0][expiry_date]" class="form-label">Expiry Date</label>
                            <input type="date" class="form-control" id="batches[0][expiry_date]" name="batches[0][expiry_date]">
                        </div>
                        <div class="col-md-2">
                            <label for="batches[0][cost_per_unit]" class="form-label">Cost/Unit</label>
                            <input type="number" step="0.01" class="form-control" id="batches[0][cost_per_unit]" name="batches[0][cost_per_unit]">
                        </div>
                        <div class="col-md-1">
                            <button type="button" class="btn btn-danger btn-sm remove-batch-btn" style="display:none;">Remove</button>
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" id="add-batch-btn" class="btn btn-secondary btn-sm">Add Another Batch</button>

            <hr>

            <div class="mb-3">
                <label for="notes" class="form-label">Notes</label>
                <textarea class="form-control" id="notes" name="notes" rows="3">{{ form_data.notes if form_data else '' }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary">Record Movement</button>
            <a href="{{ url_for('inventory.list_items') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const addBatchBtn = document.getElementById('add-batch-btn');
    const batchesContainer = document.getElementById('batches-container');
    const movementTypeSelect = document.getElementById('movement_type');
    const itemIdSelect = document.getElementById('item_id');
    const issuanceOptions = document.getElementById('issuance-options');
    const batchSelection = document.getElementById('batch-selection');
    let batchIndex = 1;
    let availableBatches = [];

    function updateRemoveButtons() {
        const removeButtons = batchesContainer.querySelectorAll('.remove-batch-btn');
        removeButtons.forEach(btn => {
            btn.style.display = removeButtons.length > 1 ? 'inline-block' : 'none';
        });
    }

    function toggleBatchFields(isIssuance) {
        const firstBatchForm = batchesContainer.querySelector('.batch-form');
        const batchNumberInput = firstBatchForm.querySelector('[name="batches[0][batch_number]"]');
        const expiryDateInput = firstBatchForm.querySelector('[name="batches[0][expiry_date]"]');

        if(isIssuance) {
            batchNumberInput.readOnly = true;
            expiryDateInput.readOnly = true;
        } else {
            batchNumberInput.readOnly = false;
            expiryDateInput.readOnly = false;
        }
    }

    function fetchBatches() {
        const itemId = itemIdSelect.value;
        if (!itemId) return;

        fetch(`/stock/items/${itemId}/batches`)
            .then(response => response.json())
            .then(data => {
                availableBatches = data;
                batchSelection.innerHTML = '<option value="">Select a batch to issue</option>';
                if (data && data.length > 0) {
                    data.forEach(batch => {
                        const option = document.createElement('option');
                        option.value = batch.batch_number;
                        option.textContent = `Batch: ${batch.batch_number || 'N/A'} - Expires: ${batch.expiry_date || 'N/A'} (Stock: ${batch.batch_stock})`;
                        batchSelection.appendChild(option);
                    });
                }
            });
    }

    function handleMovementTypeChange() {
        const isIssuance = movementTypeSelect.value === 'issuance';
        issuanceOptions.style.display = isIssuance ? 'block' : 'none';
        addBatchBtn.style.display = isIssuance ? 'none' : 'inline-block';
        
        // For issuance, we only allow one batch at a time from the dropdown
        if (isIssuance) {
            // Remove all but the first batch form
            while (batchesContainer.children.length > 1) {
                batchesContainer.removeChild(batchesContainer.lastChild);
            }
            fetchBatches();
            toggleBatchFields(true);
        } else {
            toggleBatchFields(false);
        }
        updateRemoveButtons();
    }

    addBatchBtn.addEventListener('click', function () {
        const newBatchForm = batchesContainer.children[0].cloneNode(true);
        newBatchForm.dataset.batchIndex = batchIndex;
        newBatchForm.querySelectorAll('input, select').forEach(input => {
            const name = input.name.replace(/\[0\]/, '[' + batchIndex + ']');
            const id = input.id.replace(/\[0\]/, '[' + batchIndex + ']');
            input.name = name;
            input.id = id;
            input.value = '';
        });
        batchesContainer.appendChild(newBatchForm);
        batchIndex++;
        updateRemoveButtons();
    });

    batchesContainer.addEventListener('click', function (e) {
        if (e.target && e.target.classList.contains('remove-batch-btn')) {
            e.target.closest('.batch-form').remove();
            updateRemoveButtons();
        }
    });

    movementTypeSelect.addEventListener('change', handleMovementTypeChange);
    itemIdSelect.addEventListener('change', function() {
        if (movementTypeSelect.value === 'issuance') {
            fetchBatches();
        }
    });

    batchSelection.addEventListener('change', function() {
        const selectedBatchNumber = this.value;
        const selectedBatch = availableBatches.find(b => b.batch_number === selectedBatchNumber);
        const firstBatchForm = batchesContainer.querySelector('.batch-form');

        if (selectedBatch) {
            firstBatchForm.querySelector('[name="batches[0][batch_number]"]').value = selectedBatch.batch_number;
            firstBatchForm.querySelector('[name="batches[0][expiry_date]"]').value = selectedBatch.expiry_date;
        }
    });

    // Initial state
    updateRemoveButtons();
    handleMovementTypeChange();
});
</script>
{% endblock %}
