{% extends "base.html" %}

{% block title %}404 - Page Not Found - MediLogix{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">
    <div class="display-1 text-info fw-bold mb-4">404</div>
    <h2 class="mb-3">Oops! Page Not Found</h2>
    <p class="text-muted mb-4">The page you're looking for doesn't exist or has
      been moved. Use the navigation to find your way back.</p>
    <a href="{{ url_for('main.dashboard') }}"
      class="btn btn-primary btn-lg shadow-sm">
      <i class="bi bi-house-door-fill me-2"></i> Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
