{% extends "base.html" %}

{% block title %}500 - Server Error - MediLogix{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">
    <div class="display-1 text-danger fw-bold mb-4">500</div>
    <h2 class="mb-3">Something Went Wrong</h2>
    <p class="text-muted mb-4">Our server encountered an unexpected error. Don't
      worry, our team has been notified (log recorded). Please try again
      shortly.</p>
    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
      <a href="javascript:history.back()"
        class="btn btn-outline-secondary btn-lg me-md-2">Go Back</a>
      <a href="{{ url_for('main.dashboard') }}"
        class="btn btn-primary btn-lg">Dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
