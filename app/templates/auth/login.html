{% extends "base.html" %}

{% block title %}Login - SAMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card mt-5 shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-3">
                    <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="SAMS Logo" class="img-fluid" style="max-height: 100px;">
                </div>
                <h3 class="card-title text-center mb-4">SAMS Login</h3>
                <form method="POST" action="{{ url_for('auth.login_page') }}">
                    {# Add CSRF token here if using Flask-WTF: {{ form.csrf_token }} #}
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <p>Don't have an account? <a href="{{ url_for('auth.register_page') }}">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
